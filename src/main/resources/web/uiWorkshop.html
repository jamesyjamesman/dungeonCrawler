<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Crawler</title>
    <link rel="stylesheet" href="styleNew.css">
    <script src="dataParsers.js" defer></script>
    <script src="game.js" defer></script>
    <script src="helpers.js" defer></script>
    <script src="renderers.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <div id="popup" class="invisible" tabindex="-1">
        <p id="popupText"></p>
        <button id="closePopup" class="clickableButton" onclick="hidePopup()">Close</button>
    </div>
    <div id="all">
        <div id="left">
            <div id="info" class="bordered">
                Additional information goes here
            </div>
            <div id="descriptionNavigation" class="bordered">
                <div id="description"></div>
                <div id="navigation">
                    <button id="continue" class="disabled">Continue</button>
                </div>
            </div>
            <div id="statusInformation">
                <div id="gold">
                    <img id="goldImage" src="textures/torch.png">
                    <span id="goldAmount">30</span>
                </div>
                <div id="health">
                    <div id="absorptionBar" class="bar"></div>
                    <div id="healthBar" class="bar"></div>
                    <div id="emptyHealthBar" class="bar"></div>
                </div>
                <span id="healthNumber">9/10 (+0)</span>
                <div id="promptContainer">
                    <label for="prompt">&gt; </label>
                    <input id="prompt">
                </div>
                <div id="experience">
                    <div id="experienceBar" class="bar"></div>
                    <div id="emptyExperienceBar" class="bar"></div>
                </div>
                <span id="experienceNumber">3/10</span>
            </div>
        </div>
        <div id="right">
            <div id="statusTicker" class="bordered"></div>
            <div id="inventoryContainer" class="bordered">
                <div id="inventoryButtons">
                    <section>
                        <img id="genericButton" src="textures/torch.png">
                    </section>
                    <section>
                        <img id="relicButton" src="textures/torch.png">
                    </section>
                    <section>
                        <img id="weaponButton" src="textures/torch.png">
                    </section>
                    <section>
                        <img id="armorButton" src="textures/torch.png">
                    </section>
                    <section id="capacity">
                        10/10
                    </section>
                </div>
                <div id="genericItems"></div>
                <div id="relicItems"></div>
                <div id="weaponItems"></div>
                <div id="armorItems"></div>
            </div>
        </div>
    </div>
    <div id="error" class="bordered">
        I'm error text!
    </div>
</body>
</html>
