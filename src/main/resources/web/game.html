<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Crawler</title>
    <script src="dataParsers.js" defer></script>
    <script src="game.js" defer></script>
    <script src="helpers.js" defer></script>
    <script src="renderers.js" defer></script>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="popup" class="invisible" tabindex="-1">
        <p id="popupText"></p>
        <button id="closePopup" class="clickableButton" onclick="hidePopup()">Close</button>
    </div>

    <div class="mainContainer">
        <div class="mainContextDiv uiElement" id="mainDiv"></div>
        <div class="uiElement" id="errorDiv"></div>
        <input class="uiElement input" type="text" id="textInput"/>
    </div>

    <div class="uiElement" id="descriptionDiv"><p>
        The room is empty except for a hole in the ceiling.<br>
        Sunlight pours through, vines creeping down the cracked bricks.<br>
        They're out of reach.
    </p></div>

    <div class="statusContainer">
        <div class="uiElement" id="statusTicker"></div>
        <div class="uiElement" id="statusChecker"></div>
    </div>

    <div class="inventoryContainer">
        <div class="inventoryButtonContainer">
            <button id="inventoryButton" class="inventoryButton buttonSelected" onclick="inventoryVisible()">Inventory</button>
            <button id="relicButton" class="inventoryButton" onclick="relicsVisible()">Relics</button>
        </div>
        <div id="inventory" class="inventoryElement uiElement"></div>
        <div id="relics" class="inventoryElement invisible uiElement"></div>
    </div>

</body>
</html>
